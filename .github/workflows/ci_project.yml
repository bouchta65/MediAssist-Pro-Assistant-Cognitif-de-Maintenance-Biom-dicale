name: MediAssist-Pro CI/CD

on:
  push:
    branches: [ main, dev, MPACDMB-* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test & Code Quality
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Code quality check
      run: |
        pip install flake8
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run unit tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mediassist_test
        SECRET_KEY: test-secret-key
        TESTING: true
      run: |
        pytest tests/ -v

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile -t bouchta65/mediassist-api:latest .

    - name: Test Docker image
      run: |
        docker run -d -p 8000:8000 --name test-api bouchta65/mediassist-api:latest
        sleep 10
        docker logs test-api
        docker stop test-api
        docker rm test-api

    - name: Push to Docker Hub
      run: |
        docker push bouchta65/mediassist-api:latest
