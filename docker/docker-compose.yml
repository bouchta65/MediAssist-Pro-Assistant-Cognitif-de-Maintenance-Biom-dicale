version: "3.9"

services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mediassist-api
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - ../.env
    depends_on:
      - db
      - chroma
    volumes:
      - ..:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    container_name: mediassist-db
    restart: always
    env_file:
      - ../.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mediassist-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mediassist.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db    

  chroma:
    image: chromadb/chroma
    container_name: mediassist-chroma
    restart: always
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: mediassist-mlflow
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      - db
    entrypoint: >
      sh -c "pip install psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/$${POSTGRES_DB}_mlflow
             --default-artifact-root /mlflow/artifacts"

  prometheus:
    image: prom/prometheus:latest
    container_name: mediassist-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: mediassist-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: mediassist-cadvisor
    restart: always
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    depends_on:
      - api
      - db
      - chroma

volumes:
  postgres_data:
  chroma_data:
  pgadmin_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
