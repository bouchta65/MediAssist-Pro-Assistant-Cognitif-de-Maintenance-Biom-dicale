global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mediassist-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
